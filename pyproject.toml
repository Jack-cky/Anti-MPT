[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "antimpt"
version = "1.2.3"
description = "Anti-MPT dashboard and pipeline modules"
license = { text = "MIT" }
authors = [{ name = "Jack Chan" }]
requires-python = "~=3.12.0"
dependencies = [
    "Django==5.2.2",
    "PyMySQL==1.1.1",
    "PyYAML==6.0.2",
    "numpy==2.2.5",
    "pandas==2.2.3",
    "python-dotenv==1.1.0",
    "whitenoise==6.9.0",
]

[project.optional-dependencies]
dashboard = [
    "gunicorn==26.0.0",
    "plotly==6.1.2",
]
pipeline = [
    "fastapi==0.136.3",
    "finta==1.3",
    "gymnasium==1.1.1",
    "matplotlib==3.10.9",
    "prefect==3.7.4",
    "pyarrow==20.0.0",
    "scipy==1.15.3",
    "stable-baselines3==2.6.0",
    "torch==2.12.0",
    "yfinance==0.2.61",
]

[tool.setuptools.packages.find]
include = ["antimpt*"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
